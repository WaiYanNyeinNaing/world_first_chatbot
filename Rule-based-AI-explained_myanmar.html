<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIZA မြန်မာ - 1966 CRT</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { font-family: 'VT323', monospace; background:#020202; color:#00ff41; }
  .mm { font-family: "Noto Sans Myanmar", system-ui, sans-serif; }
  #chatLog::-webkit-scrollbar { width: 8px; }
  #chatLog::-webkit-scrollbar-thumb { background:#004d1a; border-radius:4px; }
  .flicker { animation: flicker 2.5s infinite; }
  @keyframes flicker { 0%,100% { opacity:1 } 50% { opacity:0.96 } 52% { opacity:0.98 } 54% { opacity:0.95 } }
  .crt-glow { text-shadow: 0 0 2px #00ff41, 0 0 10px #00ff4155; }
</style>
</head>
<body class="min-h-screen flex flex-col flicker">
<div class="pointer-events-none fixed inset-0 z-50">
  <div class="absolute inset-0" style="background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,255,65,0.04) 2px, rgba(0,255,65,0.04) 3px);"></div>
  <div class="absolute inset-0" style="box-shadow: inset 0 0 80px rgba(0,0,0,0.9);"></div>
</div>

<header class="border-b border-green-800 bg-black/60 backdrop-blur p-4 text-center">
  <h1 class="text-4xl md:text-5xl crt-glow tracking-widest">ELIZA <span class="mm">မြန်မာ</span></h1>
  <p class="mm text-green-300/80 mt-1">1966 ELIZA ၏ မြန်မာဗားရှင်း — CRT အတွေ့အကြုံ</p>
  <nav aria-label="Primary" class="mt-4 flex flex-wrap justify-center gap-2 text-[11px] tracking-[0.22em] uppercase">
    <a href="index.html" class="border border-green-800 px-3 py-1.5 hover:bg-green-900/50 transition">Home</a>
    <a href="Rule-based-AI-explained.html" class="border border-green-800 px-3 py-1.5 hover:bg-green-900/50 transition">English</a>
    <a href="Rule-based-AI-explained_myanmar.html" aria-current="page" class="border border-green-800 px-3 py-1.5 bg-green-900/50 hover:bg-green-900/50 transition">မြန်မာ</a>
  </nav>
</header>

<main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 p-4 max-w-7xl mx-auto w-full">
  <section class="lg:col-span-2 flex flex-col bg-black/40 border border-green-800 rounded-lg shadow-[0_0_25px_rgba(0,255,65,0.15)] overflow-hidden">
    <div id="chatLog" class="flex-1 p-4 overflow-y-auto h-[60vh] space-y-3"></div>
    <div class="border-t border-green-800 p-3 space-y-3 bg-black/60">
      <div id="chips" class="flex flex-wrap gap-2"></div>
      <div class="flex gap-2">
        <input id="userInput" type="text" autocomplete="off" placeholder="ဒီမှာ ရိုက်ထည့်ပါ..." class="mm flex-1 bg-black border border-green-700 rounded px-3 py-2 outline-none focus:ring-1 focus:ring-green-500 text-green-200 placeholder-green-700">
        <button id="sendBtn" class="px-5 py-2 bg-green-700 hover:bg-green-600 active:bg-green-800 rounded font-bold tracking-widest transition">SEND</button>
        <button id="resetBtn" class="px-5 py-2 border border-green-700 hover:bg-green-900 rounded font-bold tracking-widest transition">RESET</button>
      </div>
    </div>
  </section>

  <aside class="lg:col-span-1 bg-black/40 border border-green-800 rounded-lg p-4 space-y-3 overflow-y-auto max-h-[80vh]">
    <h2 class="text-2xl font-bold border-b border-green-800 pb-2 crt-glow">Rule Trace</h2>
    <div class="space-y-2 text-[15px] leading-relaxed">
      <div><span class="opacity-70">Normalized Input:</span> <span id="traceNorm" class="mm text-green-200"></span></div>
      <div><span class="opacity-70">Matched Keyword:</span> <span id="traceKw" class="mm text-green-200"></span></div>
      <div><span class="opacity-70">Rank:</span> <span id="traceRank" class="text-green-200"></span></div>
      <div><span class="opacity-70">Decomposition Pattern:</span> <span id="traceDecomp" class="mm text-green-200"></span></div>
      <div><span class="opacity-70">Captured Groups:</span> <ul id="traceCaps" class="list-disc list-inside mm text-green-200 ml-2"></ul></div>
      <div><span class="opacity-70">After Reflection:</span> <span id="traceRefl" class="mm text-green-200"></span></div>
      <div><span class="opacity-70">Response Template:</span> <span id="traceTemplate" class="mm text-green-200"></span></div>
      <div><span class="opacity-70">Final Response:</span> <span id="traceFinal" class="mm text-green-200"></span></div>
    </div>
  </aside>
</main>

<script>
const initialGreeting = "မင်္ဂလာပါ။ ကျွန်တော် ELIZA ပါ။ ဘာကူညီပေးရမလဲ။";
const quitWords = ["သွားတော့မယ်","သွားပြီ","bye","တော်ပြီ"];

const reflectionMap = {
  "ကျွန်တော်":"ခင်ဗျား",
  "ကျွန်မ":"ခင်ဗျား",
  "ကျွန်တော့်":"ခင်ဗျားရဲ့",
  "ငါ":"နင်",
  "ငါ့":"နင့်",
  "ခင်ဗျား":"ကျွန်တော်",
  "နင်":"ငါ"
};

const keywords = [
  {kw:"မင်္ဂလာပါ", rank:20, patterns:[{decomp:"*", responses:["မင်္ဂလာပါ။ ဒီနေ့ ဘယ်လိုခံစားရလဲ။","ဟယ်လို။ ပြောချင်တာလေး ဆက်ပြောပါ။"]}]},
  {kw:"ဘာလို့", rank:15, patterns:[
    {decomp:"ဘာလို့ *", responses:["ဘာလို့ $1 လဲလို့ သင်ထင်ပါသလဲ။","$1 က ဘာလို့ အရေးကြီးပါသလဲ။"]},
    {decomp:"*", responses:["အဲဒါကို ဘာလို့ မေးရတာလဲ။"]}
  ]},
  {kw:"စိတ်ညစ်တယ်", rank:14, patterns:[
    {decomp:"* စိတ်ညစ်တယ် *", responses:["စိတ်ညစ်ရတဲ့ အကြောင်းကို နည်းနည်းပြောပြနိုင်မလား။","ဘာကြောင့် စိတ်ညစ်တယ်လို့ ခံစားရတာလဲ။"]},
    {decomp:"*", responses:["စိတ်ညစ်နေတာ ကြာပြီလား။"]}
  ]},
  {kw:"ဝမ်းနည်းတယ်", rank:14, patterns:[
    {decomp:"* ဝမ်းနည်းတယ် *", responses:["ဝမ်းနည်းစရာ $1 အကြောင်း ပြောပြပါ။","ဝမ်းနည်းမှုက ဘယ်လောက်ခံစားရလဲ။"]}
  ]},
  {kw:"စိတ်ပူတယ်", rank:14, patterns:[
    {decomp:"* စိတ်ပူတယ် *", responses:["စိတ်ပူနေတဲ့ $1 အကြောင်း နည်းနည်းရှင်းပြပါ။","စိတ်ပူတာ သက်သာအောင် ဘာလုပ်ဖူးလဲ။"]}
  ]},
  {kw:"ပျော်တယ်", rank:12, patterns:[
    {decomp:"* ပျော်တယ် *", responses:["ပျော်ရတာကောင်းပါတယ်။ ဘာကြောင့် $1 ပျော်ရတာလဲ။","ပျော်နေတဲ့ အချိန်မှာ ဘာတွေဖြစ်နေလဲ။"]}
  ]},
  {kw:"အမေ", rank:12, patterns:[
    {decomp:"* အမေ *", responses:["အမေနဲ့ ပတ်သက်ပြီး နည်းနည်းပိုပြောပြပါ။","အမေက သင့်အပေါ် ဘယ်လိုသက်ရောက်မှုရှိလဲ။"]}
  ]},
  {kw:"အဖေ", rank:12, patterns:[
    {decomp:"* အဖေ *", responses:["အဖေအကြောင်း ဆက်ပြောပါ။","အဖေနဲ့ ဆက်ဆံရေးက ဘယ်လိုရှိလဲ။"]}
  ]},
  {kw:"မှတ်မိတယ်", rank:10, patterns:[
    {decomp:"* မှတ်မိတယ် *", responses:["$1 ကို မှတ်မိတာက သင့်အတွက် ဘာကိုဆိုလိုလဲ။","အဲဒီ မှတ်မိမှုက ဘာကြောင့် ပေါ်လာတာလဲ။"]}
  ]},
  {kw:"အိပ်မက်", rank:10, patterns:[
    {decomp:"* အိပ်မက် *", responses:["အိပ်မက်ထဲမှာ ဘာတွေမြင်ရလဲ။","အိပ်မက်က သင့်ကို ဘာခံစားစေလဲ။"]}
  ]},
  {kw:"တောင်းပန်ပါတယ်", rank:8, patterns:[
    {decomp:"*", responses:["တောင်းပန်စရာ မလိုပါဘူး။ ဆက်ပြောပါ။"]}
  ]},
  {kw:"xnone", rank:0, patterns:[
    {decomp:"*", responses:["ဆက်ပြောပါ။","အဲဒါကို နည်းနည်းရှင်းပြနိုင်မလား။","နားလည်ပါတယ်။","အဲဒါက သင့်အတွက် ဘယ်လို အဓိပ္ပာယ်ရှိလဲ။"]}
  ]}
];

function normalize(text){
  return text
    .replace(/[.,!?;:,၊။]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function reflect(text){
  const keys = Object.keys(reflectionMap).sort((a,b)=>b.length-a.length);
  const pattern = new RegExp(keys.map(k=>k.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  return text.replace(pattern, m => reflectionMap[m] || m);
}

function decompToRegex(decomp){
  let esc = decomp.replace(/[.+?^${}()|[\]\\]/g,'\\$&');
  esc = esc.replace(/\*/g,'(.*?)');
  esc = esc.replace(/\s+/g,'\\s*');
  return new RegExp('^'+esc+'$','u');
}

function elizaRespond(raw){
  const normalized = normalize(raw);
  let result = {
    normalized,
    matchedKeyword:"xnone",
    rank:0,
    decomp:"*",
    caps:[],
    capsReflected:[],
    template:"",
    final:""
  };

  outer: for(const kwObj of keywords){
    if(kwObj.kw==="xnone") continue;
    if(!normalized.includes(kwObj.kw)) continue;
    for(const pat of kwObj.patterns){
      const re = decompToRegex(pat.decomp);
      const m = normalized.match(re);
      if(m){
        result.matchedKeyword = kwObj.kw;
        result.rank = kwObj.rank;
        result.decomp = pat.decomp;
        result.caps = m.slice(1).map(s=>s.trim()).filter(s=>s!=="");
        result.capsReflected = result.caps.map(reflect);
        result.template = pat.responses[Math.floor(Math.random()*pat.responses.length)];
        result.final = result.template.replace(/\$(\d+)/g,(_,n)=>result.capsReflected[parseInt(n)-1]||"");
        break outer;
      }
    }
  }
  if(!result.final){
    const x = keywords.find(k=>k.kw==="xnone");
    const pat = x.patterns[0];
    result.matchedKeyword = "xnone";
    result.rank = 0;
    result.decomp = pat.decomp;
    result.template = pat.responses[Math.floor(Math.random()*pat.responses.length)];
    result.final = result.template;
  }
  return result;
}

const chatLog = document.getElementById('chatLog');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');

function appendMessage(who, text, isUser=false){
  const wrap = document.createElement('div');
  wrap.className = 'flex ' + (isUser ? 'justify-end' : 'justify-start');
  const bubble = document.createElement('div');
  bubble.className = (isUser ? 'bg-green-900/40 border-green-700' : 'bg-black/60 border-green-800') + ' border rounded-lg px-3 py-2 max-w-[85%]';
  bubble.innerHTML = `<div class="text-[11px] opacity-70 tracking-widest mb-1">${who}</div><div class="mm text-green-100 whitespace-pre-wrap break-words">${text}</div>`;
  wrap.appendChild(bubble);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
  return bubble.querySelector('.mm');
}

async function typeMessage(el, text, speed=18){
  el.textContent = "";
  for(let i=0;i<text.length;i++){
    el.textContent += text[i];
    await new Promise(r=>setTimeout(r, speed));
    chatLog.scrollTop = chatLog.scrollHeight;
  }
}

function updateTrace(res){
  document.getElementById('traceNorm').textContent = res.normalized;
  document.getElementById('traceKw').textContent = res.matchedKeyword;
  document.getElementById('traceRank').textContent = res.rank;
  document.getElementById('traceDecomp').textContent = res.decomp;
  const capsEl = document.getElementById('traceCaps');
  capsEl.innerHTML = "";
  res.caps.forEach((c,i)=>{
    const li = document.createElement('li');
    li.textContent = `$${i+1}: ${c}`;
    capsEl.appendChild(li);
  });
  document.getElementById('traceRefl').textContent = res.capsReflected.join(' | ');
  document.getElementById('traceTemplate').textContent = res.template;
  document.getElementById('traceFinal').textContent = res.final;
}

function clearTrace(){
  ['traceNorm','traceKw','traceRank','traceDecomp','traceRefl','traceTemplate','traceFinal'].forEach(id=>document.getElementById(id).textContent="");
  document.getElementById('traceCaps').innerHTML="";
}

function disableInput(){
  userInput.disabled = true;
  sendBtn.disabled = true;
  sendBtn.classList.add('opacity-50','cursor-not-allowed');
}

function enableInput(){
  userInput.disabled = false;
  sendBtn.disabled = false;
  sendBtn.classList.remove('opacity-50','cursor-not-allowed');
  userInput.focus();
}

async function handleSend(){
  const raw = userInput.value;
  if(!raw.trim()) return;
  appendMessage('YOU', raw, true);
  userInput.value = "";
  const normalizedLower = normalize(raw).toLowerCase();
  const isQuit = quitWords.some(w => normalizedLower.includes(w.toLowerCase()));
  if(isQuit){
    const goodbye = "ကောင်းပါပြီ။ နောက်မှ ပြန်လာပါ။";
    const el = appendMessage('ELIZA', "", false);
    await typeMessage(el, goodbye);
    updateTrace({normalized:normalize(raw), matchedKeyword:"(quit)", rank:"-", decomp:"-", caps:[], capsReflected:[], template:goodbye, final:goodbye});
    disableInput();
    return;
  }
  const res = elizaRespond(raw);
  updateTrace(res);
  const el = appendMessage('ELIZA', "", false);
  await typeMessage(el, res.final);
}

function resetChat(){
  chatLog.innerHTML = "";
  clearTrace();
  enableInput();
  const el = appendMessage('ELIZA', initialGreeting, false);
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
resetBtn.addEventListener('click', resetChat);

// Chips
const chipsData = ["မင်္ဂလာပါ","ကျွန်တော် စိတ်ညစ်တယ်","ကျွန်မ စိတ်ပူတယ်","အမေ က ကျွန်တော့်ကို စိတ်ညစ်စေတယ်","ငယ်ဘဝကို မှတ်မိတယ်","ဘာလို့ နားမလည်တာလဲ","သွားတော့မယ်"];
const chipsEl = document.getElementById('chips');
chipsData.forEach(txt=>{
  const btn = document.createElement('button');
  btn.className = "mm text-xs px-3 py-1 border border-green-800 rounded-full hover:bg-green-900/50 transition";
  btn.textContent = txt;
  btn.addEventListener('click', ()=>{
    userInput.value = txt;
    handleSend();
  });
  chipsEl.appendChild(btn);
});

// Init
resetChat();
</script>
</body>
</html>
